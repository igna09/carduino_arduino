; PlatformIO Project Configuration File

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 2MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
; Forza la compilazione con i simboli di debug (-g3) per l'exception decoder
build_type = debug
build_flags = 
    -g3
    -Wno-missing-field-initializers
    -Wno-attributes
monitor_filters = esp32_exception_decoder, default
extra_scripts = pre:pass_env_to_cmake.py

[env:KlineNode]
extends = env
lib_deps =
    https://github.com/igna09/KLineKWP1281Lib_ESP32.git

[env:UdpAp]
extends = env
; board_build.cmake_extra_args = -DCARDUINO_NODE_FILE_NAME=MainNode

[env:MainNode]
extends = env
; board_build.cmake_extra_args = -DCARDUINO_NODE_FILE_NAME=MainNode
lib_deps =lib_deps =
    ; https://github.com/esp-idf-lib/i2cdev.git
    ; https://github.com/esp-idf-lib/onewire.git
    https://github.com/esp-idf-lib/aht.git
    ; https://github.com/esp-idf-lib/bmp280.git
    https://github.com/dziamian/TEMT6000-ESP32-Driver

[env:MediaNode]
extends = env
; board_build.cmake_extra_args = -DCARDUINO_NODE_FILE_NAME=MediaNode
lib_deps =
    https://github.com/esp-idf-lib/encoder.git