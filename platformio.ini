; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps = 
	jandrassy/ArduinoOTA@^1.0.11
	arkhipenko/TaskScheduler@^3.7.0
	links2004/WebSockets@^2.4.1
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	ArduinoJson
	xreef/PCF8574 library@^2.3.7
	https://github.com/dok-net/ghostl
	coryjfowler/mcp_can@^1.5.1
	WiFiClientSecure
	LittleFS
build_src_filter = +<**/*.h> +<**/*.cpp> -<main_*.cpp> +<main_${PIOENV}.cpp> -<shared/CarduinoNode/*> +<shared/CarduinoNode/CarduinoNode/*> +<shared/CarduinoNode/${PIOENV}/*>
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
upload_speed = 460800
extra_scripts = 
	post:post_script.py
	download_fs.py

[env:MainCarduinoNode]
lib_deps = 
	${env.lib_deps}
	adafruit/Adafruit AHTX0@^2.0.5

[env:KlineCarduinoNode]
build_flags =
	'-DDISABLE_CAN_INTERRUPT'

[env:MediaControlCarduinoNode]
lib_deps = 
	${env.lib_deps}
	https://github.com/igna09/Versatile_RotaryEncoder

[env:DoorCarduinoNode]

[env:CommunicationCarduinoNode]
platform = espressif32
board = esp-wrover-kit
monitor_filters = esp32_exception_decoder
board_build.f_cpu = 240000000L
board_build.partitions = 4MB_smaller_SPIFFS.csv
build_unflags =
	-Werror=all
;	-std=c++11
build_flags =
;	-std=c++17
	; '-DEXTERNAL_SD'
lib_deps = 
	${env.lib_deps}
	; h2zero/NimBLE-Arduino@^1.4.0
	https://github.com/h2zero/NimBLE-Arduino.git#master

[env:test]
platform = espressif32
framework = arduino
board = esp32-s2-saola-1
monitor_filters = esp32_exception_decoder
